interface:
  display_name: "WPS 文档助手"
  short_description: "用 python-docx 一句话生成 / 编辑 / 读取 WPS 文档(.docx),WPS 与 Word 通用。"
  default_prompt: "使用 wps-doc 生成 WPS/Word 文档(.docx)。优先复用本技能 scripts/docx_tools.py 里的 new_document / add_title / add_section / add_table / read_document;依赖缺失时先 pip install python-docx。默认简体中文,先确认文档类型(周报/合同/报告等)、结构与目标目录,再生成;完成后告知产物路径并抽查前几行。"
